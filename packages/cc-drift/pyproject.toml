[project]
name = "cc-drift"
dynamic = ["version"]
description = "Detect drift between your CLAUDE.md and the actual code"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "rich>=13.7", "cctk-core>=0.3.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
cc-drift = "doc_drift.cli:main"

[tool.uv.sources]
cctk-core = { workspace = true }

[tool.hatch.version]
path = "src/doc_drift/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_drift"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/doc_drift --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
